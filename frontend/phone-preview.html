<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopaflo phone preview</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1f2328;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e6e6e6;
    }
    .toolbar { display: flex; gap: 8px; align-items: center; font-size: 13px; }
    .toolbar input {
      width: 240px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b3036;
      color: #e6e6e6;
    }
    .toolbar button {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b3036;
      color: #e6e6e6;
      cursor: pointer;
    }
    /* The device is always 414 x 868 CSS px (390 x 844 screen plus a 12px bezel).
       JS scales it down to fit the window height, so the app keeps its real phone width. */
    .stage {
      width: 414px;
      height: 868px;
      transform-origin: top left;
      flex: none;
    }
    .phone {
      width: 100%;
      height: 100%;
      border-radius: 44px;
      background: #000;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background: #fff;
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .hint { font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="url">App address</label>
    <input id="url" value="http://localhost:8081" />
    <button id="reload" type="button">Reload</button>
  </div>
  <div id="fit" style="position: relative;">
    <div class="stage" id="stage">
      <div class="phone">
        <div class="screen">
          <iframe id="app" title="Shopaflo app" src="http://localhost:8081"></iframe>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">Start the app with <code>npm run web</code> first. Code changes refresh here automatically.</div>
  <script>
    const input = document.getElementById("url");
    const frame = document.getElementById("app");
    const stage = document.getElementById("stage");
    const fit = document.getElementById("fit");

    // Scale the device so it fits the window height (toolbar and hint take about 90px).
    const fitToWindow = () => {
      const available = window.innerHeight - 90;
      const scale = Math.min(1, available / 868);
      stage.style.transform = `scale(${scale})`;
      fit.style.width = `${414 * scale}px`;
      fit.style.height = `${868 * scale}px`;
    };
    fitToWindow();
    window.addEventListener("resize", fitToWindow);

    const load = () => {
      frame.src = input.value.trim() || "http://localhost:8081";
    };
    document.getElementById("reload").addEventListener("click", load);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
  </script>
</body>
</html>
